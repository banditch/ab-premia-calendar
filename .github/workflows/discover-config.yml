name: Descubrir configuración pública

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar configuración pública
        run: python tools/probe_public_config.py > public-config-report.json
      - name: Guardar informe
        uses: actions/upload-artifact@v4
        with:
          name: public-config-report
          path: public-config-report.json
          retention-days: 7

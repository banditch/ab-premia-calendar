<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Calendarios AB Premià</title>
  <meta name="description" content="Suscríbete al calendario de cualquier equipo de AB Premià.">
  <style>
    :root{color-scheme:light;--ink:#10231d;--muted:#5f6f69;--cream:#f5f1e8;--green:#075b45;--lime:#d8f15a;--white:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}
    main{width:min(880px,calc(100% - 32px));margin:0 auto;padding:64px 0}
    header{border-left:8px solid var(--lime);padding-left:22px;margin-bottom:42px}
    h1{font-size:clamp(2.2rem,7vw,4.6rem);line-height:.95;letter-spacing:-.055em;margin:0 0 18px}
    p{color:var(--muted);max-width:650px}.panel{background:var(--white);border:1px solid #d8ded9;border-radius:22px;padding:24px;box-shadow:0 16px 45px #153a2b12}
    label{display:block;font-weight:700;margin-bottom:8px}select{width:100%;padding:14px;border:1px solid #aab6b0;border-radius:12px;background:white;font:inherit}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}a.button{display:block;text-align:center;text-decoration:none;padding:14px 18px;border-radius:12px;font-weight:750}
    .apple{background:var(--green);color:white}.google{background:var(--lime);color:var(--ink)}.disabled{opacity:.45;pointer-events:none}
    #status{margin:18px 0 0;font-size:.95rem}.foot{font-size:.85rem;margin-top:24px}
    @media(max-width:560px){main{padding:36px 0}.actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <header>
    <h1>Tu equipo.<br>Tu calendario.</h1>
    <p>Elige un equipo de Agrupació Bàsquet Premià y suscríbete una sola vez. Los cambios de horario y pabellón aparecerán en tu calendario.</p>
  </header>
  <section class="panel">
    <label for="team">Equipo</label>
    <select id="team"><option value="">Cargando equipos…</option></select>
    <div class="actions">
      <a id="apple" class="button apple disabled" href="#">Apple Calendar</a>
      <a id="google" class="button google disabled" href="#" target="_blank" rel="noopener">Google Calendar</a>
    </div>
    <p id="status" role="status"></p>
    <p class="foot">Google y Apple deciden cuándo refrescar suscripciones; algunos cambios pueden tardar varias horas.</p>
  </section>
</main>
<script>
const team = document.querySelector("#team");
const apple = document.querySelector("#apple");
const google = document.querySelector("#google");
const status = document.querySelector("#status");

function disableActions(message=""){
  apple.classList.add("disabled");
  google.classList.add("disabled");
  apple.removeAttribute("href");
  google.removeAttribute("href");
  status.textContent = message;
}

function selectTeam(){
  if(!team.value){
    disableActions("");
    return;
  }
  const httpUrl = new URL("calendars/" + team.value + ".ics", location.href).href;
  const webcalUrl = httpUrl.replace(/^https?:/, "webcal:");
  apple.href = webcalUrl;
  google.href = "https://calendar.google.com/calendar/r?cid=" + encodeURIComponent(webcalUrl);
  apple.classList.remove("disabled");
  google.classList.remove("disabled");
  status.textContent = "Suscripción disponible. El calendario se actualizará automáticamente.";
}

fetch("calendars/index.json", {cache:"no-store"}).then(r=>r.json()).then(items=>{
  team.innerHTML = '<option value="">Selecciona un equipo</option>';
  items.sort((a,b)=>(b.matches>0)-(a.matches>0) || a.name.localeCompare(b.name, "es"));
  items.forEach(item=>{
    const option=document.createElement("option");
    option.value=item.slug;
    option.disabled=item.matches===0;
    option.textContent=item.matches
      ? item.name + " (" + item.matches + " partidos)"
      : item.name + " (pendiente de calendario)";
    team.appendChild(option);
  });
  disableActions(items.length ? "Los equipos desactivados aún no tienen partidos publicados." : "Aún no hay equipos publicados.");
}).catch(()=>{
  team.innerHTML='<option value="">No se pudieron cargar los equipos</option>';
  disableActions("Inténtalo de nuevo dentro de unos minutos.");
});
team.addEventListener("change", selectTeam);
</script>
</body>
</html>
